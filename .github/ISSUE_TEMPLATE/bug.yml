name: Relatar um bug
description: Algo não funciona como esperado
labels: [bug]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu?
    validations: { required: true }
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava que acontecesse?
  - type: input
    id: versao
    attributes:
      label: Versão do Pastel
    validations: { required: true }
  - type: input
    id: so
    attributes:
      label: Sistema operacional
      placeholder: Windows 11 23H2, KDE Plasma 6...
    validations: { required: true }
